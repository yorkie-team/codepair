name: GitHub Page Publish

# CodePair is retired; codepair.yorkie.dev now serves a static notice that
# points to Wafflebase. The app build is no longer published.
on:
  push:
    branches: [main]
    paths:
      - "sunset/**"
      - ".github/workflows/gh_pages.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: sunset
